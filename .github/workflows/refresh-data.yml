# refresh-data.yml — weekly auto-rebuild of the distribution hub.
#
# Every Monday 09:00 UTC (and on demand): fetches the live mechanics-lien
# dataset from the apex app, rebuilds all 3,303 pages + SEO artifacts,
# commits any changes, pushes, and pings IndexNow. Vercel Git integration
# auto-deploys the new commit → the hub is always synced with the app's
# legal review, and search engines are notified immediately.
name: Refresh lien-data + rebuild

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch upstream dataset
        run: |
          curl -fsSL https://voicelogpro.com/lien-law-deadlines/data.json \
            -o data/lien-deadlines.source.json
          echo "fetched $(wc -c < data/lien-deadlines.source.json) bytes"

      - name: Rebuild hub
        run: python3 build.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ dist/
          if git diff --cached --quiet; then
            echo "no changes — dataset unchanged."
          else
            UPDATED=$(python3 -c "import json;print(json.load(open('data/lien-deadlines.source.json'))['updatedAt'])")
            git commit -m "chore(data): refresh lien dataset (upstream updated ${UPDATED})"
            git push
            echo "pushed — Vercel auto-deploy will pick up the new commit."
          fi

      - name: Ping IndexNow (Bing + Yandex)
        run: |
          python3 - <<'INDEXNOW_PY'
          import json, urllib.request
          with open("dist/site/indexnow-urls.json") as f:
              p = json.load(f)
          n = len(p["urlList"])
          print(f"Submitting {n} URLs for host {p['host']}…")
          for engine, url in [("Bing",   "https://api.indexnow.org/indexnow"),
                               ("Yandex", "https://yandex.com/indexnow")]:
              try:
                  req = urllib.request.Request(url,
                      data=json.dumps(p).encode(),
                      headers={"Content-Type": "application/json"})
                  r = urllib.request.urlopen(req, timeout=30)
                  print(f"  {engine}: {r.status}")
              except Exception as e:
                  print(f"  {engine}: {e}")
          print("IndexNow ping complete")
          INDEXNOW_PY
